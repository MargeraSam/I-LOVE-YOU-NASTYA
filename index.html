<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<style>
:root{--bg:#f4eadb;--fg:#4a3324;--muted:#8c7459;--paper:#eadcc7;--shadow:rgba(90,62,34,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;min-height:100vh;
display:flex;flex-direction:column;align-items:center;padding:22px 16px 34px}
#view{width:100%;max-width:920px;overflow:auto;border-radius:10px;background:var(--paper);box-shadow:0 18px 50px var(--shadow);cursor:zoom-in;-webkit-overflow-scrolling:touch}
#view.zoomed{cursor:zoom-out}
canvas{display:block;width:100%;height:auto}
.msg{max-width:560px;text-align:center;margin-top:28px;opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease}
.msg.on{opacity:1;transform:none}
h1{font-size:clamp(27px,6vw,42px);font-weight:400;font-style:italic;line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
p{margin:0;font-size:clamp(16px,3.6vw,19px);line-height:1.6;color:var(--muted)}
.hint{margin-top:20px;font-size:14px}
button{margin-top:18px;font:inherit;font-size:14px;color:var(--muted);background:none;border:1px solid var(--muted);border-radius:99px;padding:8px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>
</head>

var view=document.getElementById('view'),cv=document.getElementById('cv'),msg=document.getElementById('msg'),ctx=cv.getContext('2d');
var CW=0,CH=0,cells=[],idx=0,start=0,raf=0,DUR=6500,PAPER='#eadcc7',zoomed=false;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var img=new Image();img.onload=build;img.src=SRC;
function build(){
 var cols=230,W=3200,cw=W/cols,ch=cw*2,asp=img.width/img.height,rows=Math.round(W/asp/ch);
 CW=cw;CH=ch;cv.width=W;cv.height=rows*ch;
 var o=document.createElement('canvas');o.width=cols;o.height=rows;var x=o.getContext('2d');
 x.imageSmoothingQuality='high';x.drawImage(img,0,0,cols,rows);
 var d=x.getImageData(0,0,cols,rows).data;
 function sh(v,lt){return Math.round(lt?v+(255-v)*.4:v*.68)}
 for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
  var i=(r*cols+c)*4,R=d[i],G=d[i+1],B=d[i+2],lt=(.299*R+.587*G+.114*B)<95;
  cells.push({x:c*cw,y:r*ch,cx:c*cw+cw/2,cy:r*ch+ch*.54,ch:TEXT[(c+r*3)%TEXT.length],
   bg:'rgb('+R+','+G+','+B+')',fg:'rgb('+sh(R,lt)+','+sh(G,lt)+','+sh(B,lt)+')',t:r/rows*.62+Math.random()*.38});
 }
 cells.sort(function(a,b){return a.t-b.t});
 ctx.font='bold '+(cw*1.62)+'px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace';
 ctx.textAlign='center';ctx.textBaseline='middle';
 view.style.aspectRatio=cv.width+'/'+cv.height;
 play();
}
function paint(cl){ctx.fillStyle=cl.bg;ctx.fillRect(cl.x,cl.y,CW+1,CH+1);ctx.fillStyle=cl.fg;ctx.fillText(cl.ch,cl.cx,cl.cy)}
function play(){
 cancelAnimationFrame(raf);msg.classList.remove('on');
 ctx.fillStyle=PAPER;ctx.fillRect(0,0,cv.width,cv.height);idx=0;
 if(reduce){while(idx<cells.length)paint(cells[idx++]);msg.classList.add('on');return}
 start=performance.now();
 (function frame(now){
  var p=(now-start)/DUR;
  while(idx<cells.length&&cells[idx].t<=p)paint(cells[idx++]);
  if(idx<cells.length)raf=requestAnimationFrame(frame);else msg.classList.add('on');
 })(start);
}

 zoomed=!zoomed;view.classList.toggle('zoomed',zoomed);cv.style.width=zoomed?'420%':'100%';
 if(zoomed){view.scrollLeft=fx*view.scrollWidth-view.clientWidth/2;view.scrollTop=fy*view.scrollHeight-view.clientHeight/2}
 else{view.scrollLeft=0;view.scrollTop=0}
});
document.getElementById('again').addEventListener('click',function(){

});
